<title>Bible Reader Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a one-screen app. Reader = optional Scripture panel beside a five-row control stack
   (testament / book / chapter / play with verse arrows / settings). Pickers = big button on top,
   list in the middle, Back at the bottom. The app's own four color schemes drive every color. */
:root {
  --bg: #000000; --fg: #ffffff; --hi: #ffd400; --dim: #9a9a9a;
  --font: "Atkinson Hyperlegible", system-ui, "Helvetica Neue", Arial, sans-serif;
  --label-scale: 1;
  --label: calc(clamp(16px, min(4.4vh, 6vw), 46px) * var(--label-scale));
  --border: clamp(3px, 0.8vh, 8px);
  --gap: clamp(8px, 1.4vh, 14px);
  --radius: 16px;
  --text: 7vh;
  color-scheme: dark;
}
:root[data-scheme="yb"] { --bg: #000000; --fg: #ffe600; --hi: #ffffff; --dim: #a39a3a; color-scheme: dark; }
:root[data-scheme="bw"] { --bg: #ffffff; --fg: #000000; --hi: #0040ff; --dim: #555555; color-scheme: light; }
:root[data-scheme="by"] { --bg: #fff2a8; --fg: #000000; --hi: #0040ff; --dim: #5a5230; color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); padding-inline: 16px; padding-block: 12px; overflow: hidden; user-select: none; -webkit-user-select: none; }
#app { height: 100%; }

.screen { height: 100%; display: grid; gap: var(--gap); min-height: 0; }
#reader { grid-template-columns: minmax(0, 1fr); }
#reader .panel { display: none; }
#reader.text-on { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
#reader.text-on .panel { display: block; }
@media (max-aspect-ratio: 1/1) {
  #reader.text-on { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 34fr) minmax(0, 66fr); }
}
.controls { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 0.6fr); gap: var(--gap); min-height: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.6fr) minmax(0, 1fr); gap: var(--gap); min-height: 0; }

.btn {
  position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.05em;
  min-width: 0; min-height: 0; margin: 0; padding: 0 0.35em;
  font: 700 var(--label) / 1.05 var(--font); text-transform: uppercase; letter-spacing: 0.02em;
  color: var(--fg); background: var(--bg); border: var(--border) solid var(--fg); border-radius: var(--radius);
  cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.btn:focus-visible { outline: var(--border) solid var(--hi); outline-offset: 3px; }
.btn.filled { background: var(--fg); color: var(--bg); }
.btn.pressed { background: var(--fg); color: var(--bg); }
.btn.filled.pressed { background: var(--bg); color: var(--fg); }
.btn.describing { outline: var(--border) solid var(--hi); outline-offset: 3px; }
.btn .lbl { display: block; width: 100%; min-width: 0; max-width: 100%; overflow: hidden; text-align: center; }
.btn .lbl.nowrap { white-space: nowrap; }
.btn .glyph { font-size: 1.5em; line-height: 1; }
.btn .sub { font-size: 0.5em; letter-spacing: 0.1em; }
.btn .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--hi); opacity: 0.5; pointer-events: none; transition: none; }
.btn.holding .fill { width: 100%; transition: width var(--hold-ms, 1000ms) linear; }
.btn.spacer { visibility: hidden; }

.panel { position: relative; min-height: 0; overflow: auto; border: var(--border) solid var(--fg); border-radius: var(--radius); padding: 0.4em 0.5em; font-size: var(--text); line-height: 1.35; }
.v { padding: 0.12em 0.3em; border: var(--border) solid transparent; border-radius: 0.35em; margin: 0.1em 0; }
.v .n { font-weight: 700; font-size: 0.7em; margin-right: 0.35em; opacity: 0.85; }
.v.cur { border-color: var(--fg); }

#books { grid-template-rows: minmax(0, 1fr) minmax(0, 5fr) minmax(0, 0.6fr); }
.listwrap { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 1fr); gap: var(--gap); min-height: 0; }
.list { display: grid; grid-template-rows: repeat(6, minmax(0, 1fr)); gap: var(--gap); min-height: 0; }
.arrows { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: var(--gap); min-height: 0; }

#chapters { grid-template-rows: minmax(0, 0.55fr) minmax(0, 5fr) minmax(0, 0.6fr); }
.heading { display: flex; align-items: center; justify-content: center; min-width: 0; text-align: center; font: 700 calc(var(--label) * 0.75) / 1.1 var(--font); text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: var(--gap); min-height: 0; }
.grid .btn { font-size: calc(var(--label) * 1.25); font-variant-numeric: tabular-nums; }

#settings { grid-template-rows: repeat(7, minmax(0, 1fr)) minmax(0, 0.7fr); }
.srow { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--gap); min-height: 0; }
.set { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 0 0.5em; border: var(--border) dashed var(--dim); border-radius: var(--radius); font: 700 calc(var(--label) * 0.7) / 1.1 var(--font); text-transform: uppercase; letter-spacing: 0.04em; overflow: hidden; }
.set .name { opacity: 0.85; font-size: 0.8em; }
.set .val { font-size: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .btn { font-size: calc(var(--label) * 0.8); }
.srow .btn.span2 { grid-column: 2 / span 2; }

#toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; transform: translateX(-50%); max-width: min(92vw, 900px); padding: 0.35em 0.8em; border-radius: 999px; background: var(--fg); color: var(--bg); font: 700 clamp(13px, 2.2vh, 20px) / 1.2 var(--font); opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 0.93; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div id="toast" role="status" aria-live="polite"></div>
<main id="app">
  <section id="reader" class="screen text-on">
    <div class="panel" id="panel"></div>
    <div class="controls">
      <button class="btn" id="bTestament" data-act="testament"><span class="lbl nowrap">OLD TESTAMENT</span><span class="sub" id="bTestamentSub">PRESS FOR NEW TESTAMENT</span></button>
      <div class="row">
        <button class="btn" data-act="prevBook" data-say="Previous book." aria-label="Previous book"><span class="glyph">◀</span><span class="sub">BOOK</span></button>
        <button class="btn" id="bBook" data-act="book" data-full="JOHN" data-short="JOHN"><span class="lbl nowrap">JOHN</span></button>
        <button class="btn" data-act="nextBook" data-say="Next book." aria-label="Next book"><span class="glyph">▶</span><span class="sub">BOOK</span></button>
      </div>
      <div class="row">
        <button class="btn" data-act="prevChap" data-say="Previous chapter." aria-label="Previous chapter"><span class="glyph">◀</span><span class="sub">CHAP.</span></button>
        <button class="btn" id="bChapter" data-act="chapter" data-full="CHAPTER 3" data-short="CHAP. 3"><span class="lbl nowrap">CHAPTER 3</span></button>
        <button class="btn" data-act="nextChap" data-say="Next chapter." aria-label="Next chapter"><span class="glyph">▶</span><span class="sub">CHAP.</span></button>
      </div>
      <div class="row">
        <button class="btn" data-act="prevVerse" data-say="Previous verse." aria-label="Previous verse"><span class="glyph">◀</span><span class="sub">VERSE</span></button>
        <button class="btn filled" id="bPlay" data-act="play" data-say="Play."><span class="glyph">▶</span><span class="sub">PLAY</span></button>
        <button class="btn" data-act="nextVerse" data-say="Next verse." aria-label="Next verse"><span class="glyph">▶</span><span class="sub">VERSE</span></button>
      </div>
      <button class="btn" id="bSettings" data-act="settings" data-say="Settings."><span class="lbl nowrap">SETTINGS</span></button>
    </div>
  </section>

  <section id="books" class="screen" hidden>
    <button class="btn" id="bTestamentList" data-act="listTestament"><span class="lbl nowrap">NEW TESTAMENT</span><span class="sub">PRESS TO SWITCH</span></button>
    <div class="listwrap">
      <div class="list" id="bookList"></div>
      <div class="arrows">
        <button class="btn" data-act="bookUp" data-say="Up. Earlier books." aria-label="Up, earlier books"><span class="glyph">▲</span><span class="sub">UP</span></button>
        <button class="btn" data-act="bookDown" data-say="Down. Later books." aria-label="Down, later books"><span class="glyph">▼</span><span class="sub">DOWN</span></button>
      </div>
    </div>
    <button class="btn" data-act="back" data-say="Back."><span class="lbl nowrap">BACK</span></button>
  </section>

  <section id="chapters" class="screen" hidden>
    <div class="heading" id="chapHeading"></div>
    <div class="listwrap">
      <div class="grid" id="chapGrid"></div>
      <div class="arrows">
        <button class="btn" data-act="chapUp" data-say="Up. Earlier chapters." aria-label="Up, earlier chapters"><span class="glyph">▲</span><span class="sub">UP</span></button>
        <button class="btn" data-act="chapDown" data-say="Down. Later chapters." aria-label="Down, later chapters"><span class="glyph">▼</span><span class="sub">DOWN</span></button>
      </div>
    </div>
    <button class="btn" data-act="back" data-say="Back."><span class="lbl nowrap">BACK</span></button>
  </section>

  <section id="settings" class="screen" hidden>
    <div class="srow"><div class="set" id="sMode"><span class="name">Activate buttons by</span><span class="val" id="vMode">Click</span></div><button class="btn" id="bModeClick" data-act="modeClick" data-say="Click mode."><span class="lbl nowrap">CLICK</span></button><button class="btn" id="bModeHold" data-act="modeHold" data-say="Hold mode."><span class="lbl nowrap">HOLD</span></button></div>
    <div class="srow"><div class="set" id="sHold"><span class="name">Hold time</span><span class="val" id="vHold">1 second</span></div><button class="btn" data-act="holdShorter" data-say="Shorter hold time."><span class="lbl nowrap">SHORTER</span></button><button class="btn" data-act="holdLonger" data-say="Longer hold time."><span class="lbl nowrap">LONGER</span></button></div>
    <div class="srow"><div class="set" id="sScheme"><span class="name">Colors</span><span class="val" id="vScheme">White on black</span></div><button class="btn span2" data-act="scheme" data-say="Change colors."><span class="lbl nowrap">CHANGE COLORS</span></button></div>
    <div class="srow"><div class="set" id="sText"><span class="name">Show Scripture</span><span class="val" id="vText">On</span></div><button class="btn span2" id="bShowText" data-act="showText" data-say="Turn Scripture off."><span class="lbl nowrap">TURN OFF</span></button></div>
    <div class="srow"><div class="set" id="sSize"><span class="name">Scripture size</span><span class="val" id="vSize">Large</span></div><button class="btn" data-act="textSmaller" data-say="Smaller Scripture."><span class="lbl nowrap">SMALLER</span></button><button class="btn" data-act="textLarger" data-say="Larger Scripture."><span class="lbl nowrap">LARGER</span></button></div>
    <div class="srow"><div class="set" id="sBtn"><span class="name">Button text size</span><span class="val" id="vBtn">Medium</span></div><button class="btn" data-act="btnSmaller" data-say="Smaller button text."><span class="lbl nowrap">SMALLER</span></button><button class="btn" data-act="btnLarger" data-say="Larger button text."><span class="lbl nowrap">LARGER</span></button></div>
    <div class="srow"><div class="set" id="sVoice"><span class="name">Voice</span><span class="val" id="vVoice">Default</span></div><button class="btn" data-act="voicePrev" data-say="Previous voice."><span class="lbl nowrap">PREVIOUS</span></button><button class="btn" data-act="voiceNext" data-say="Next voice."><span class="lbl nowrap">NEXT</span></button></div>
    <button class="btn" data-act="back" data-say="Back."><span class="lbl nowrap">BACK</span></button>
  </section>
</main>

    case 'bookUp': if (bookPage > 0) { bookPage--; renderBooks(); speak(rangeBooks()); } else speak('This is the top of the list.'); break;
    case 'bookDown': { const n = booksOf(listTestament).length; if ((bookPage + 1) * PAGE_BOOKS < n) { bookPage++; renderBooks(); speak(rangeBooks()); } else speak('This is the end of the list.'); break; }
    case 'bookItem': { const i = +el.dataset.index; S.book = i; S.chapter = 1; S.verse = 1; save(); returnHome(BOOKS[i].n + ', chapter 1.'); break; }
    case 'chapUp': if (chapPage > 0) { chapPage--; renderChapters(); speak(rangeChaps()); } else speak('This is the first page.'); break;
    case 'chapDown': { const n = BOOKS[chapBook].v.length; if ((chapPage + 1) * PAGE_CHAPS < n) { chapPage++; renderChapters(); speak(rangeChaps()); } else speak('This is the last page.'); break; }
    case 'chapItem': { S.book = chapBook; S.chapter = +el.dataset.chapter; S.verse = 1; save(); returnHome(book().n + ', chapter ' + S.chapter + '.'); break; }
    case 'back': returnHome('Back.'); break;
    case 'modeClick': S.mode = 'click'; save(); renderSettings(); speak('Click mode. Buttons activate with a click. Right-click a button to hear its name.'); break;
    case 'modeHold': S.mode = 'hold'; save(); renderSettings(); speak('Hold mode. Buttons activate when held for ' + holdLabel() + '. A short press only reads the name.'); break;
    case 'holdShorter': S.holdMs = Math.max(500, S.holdMs - 250); save(); renderSettings(); speak('Hold time ' + holdLabel() + '.'); break;
    case 'holdLonger': S.holdMs = Math.min(3000, S.holdMs + 250); save(); renderSettings(); speak('Hold time ' + holdLabel() + '.'); break;
    case 'scheme': { const i = SCHEMES.findIndex(x => x[0] === S.scheme); S.scheme = SCHEMES[(i + 1) % SCHEMES.length][0]; save(); applyLook(); renderSettings(); speak(SCHEMES.find(x => x[0] === S.scheme)[1] + '.'); break; }
    case 'showText': S.showText = !S.showText; save(); renderSettings(); speak(S.showText ? 'Scripture on.' : 'Scripture off.'); break;
    case 'textSmaller': S.textStep = Math.max(0, S.textStep - 1); save(); applyLook(); renderSettings(); speak('Scripture size ' + TEXT_STEPS[S.textStep][0] + '.'); break;
    case 'textLarger': S.textStep = Math.min(TEXT_STEPS.length - 1, S.textStep + 1); save(); applyLook(); renderSettings(); speak('Scripture size ' + TEXT_STEPS[S.textStep][0] + '.'); break;
    case 'btnSmaller': S.btnStep = Math.max(0, S.btnStep - 1); save(); applyLook(); renderSettings(); speak('Button text ' + BTN_STEPS[S.btnStep][0] + '.'); break;
    case 'btnLarger': S.btnStep = Math.min(BTN_STEPS.length - 1, S.btnStep + 1); save(); applyLook(); renderSettings(); speak('Button text ' + BTN_STEPS[S.btnStep][0] + '.'); break;
    case 'voicePrev': changeVoice(-1); break;
    case 'voiceNext': changeVoice(1); break;
  }
}
function describe(el, suffix) {
  const t = el.dataset.say || el.textContent.trim();
  if (!t) return;
  const text = t + (suffix || '');
  el.classList.add('describing'); setTimeout(() => el.classList.remove('describing'), 1200);
  if (playing) { hushAll(); speak(text, () => { if (playing) speakVerse(); }); }
  else speak(text);
}

/* ---------- input: click mode (click activates; right-click or long-press reads) and hold mode (hold activates; a short press reads) ---------- */
let holdTimer = null, holdEl = null, pressTimer = null, suppressClick = false, lastDescribe = 0;
function cancelHold() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  if (holdEl) { holdEl.classList.remove('holding'); }
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn'); suppressClick = false;
  if (!b || b.classList.contains('spacer') || e.button !== 0) return;
  cancelHold(); holdEl = b;
  if (S.mode === 'hold') {
    b.style.setProperty('--hold-ms', S.holdMs + 'ms');
    requestAnimationFrame(() => b.classList.add('holding'));
    holdTimer = setTimeout(() => { holdTimer = null; b.classList.remove('holding'); suppressClick = true; activate(b); }, S.holdMs);
  } else {
    pressTimer = setTimeout(() => { pressTimer = null; suppressClick = true; lastDescribe = performance.now(); describe(b); }, 900);
  }
});
document.addEventListener('pointermove', e => {
  if (!holdEl || (!holdTimer && !pressTimer)) return;
  if (e.target.closest('.btn') !== holdEl) { cancelHold(); suppressClick = true; }
});
function endPress() {
  if (holdTimer) {
    const el = holdEl;
    cancelHold(); suppressClick = true;
    lastDescribe = performance.now(); describe(el, ' Hold to activate.');
  } else if (pressTimer) { cancelHold(); }
  holdEl = null;
}
document.addEventListener('pointerup', endPress);
document.addEventListener('pointercancel', endPress);
document.addEventListener('click', e => {
  const b = e.target.closest('.btn');
  if (!b || b.classList.contains('spacer')) return;
  if (suppressClick) { suppressClick = false; return; }
  if (S.mode === 'hold' && e.detail !== 0) return;
  activate(b);
});
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (holdTimer) return;
  if (performance.now() - lastDescribe < 1000) return;
  const el = e.target.closest('.btn, .set, .panel, .heading');
  if (el && !el.classList.contains('spacer')) { lastDescribe = performance.now(); describe(el); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('.btn') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'Escape') { if (screen !== 'reader') returnHome('Back.'); return; }
  if (screen !== 'reader') return;
  const map = { ' ': 'play', ArrowLeft: 'prevVerse', ArrowRight: 'nextVerse', ArrowUp: 'prevChap', ArrowDown: 'nextChap', PageUp: 'prevChap', PageDown: 'nextChap', b: 'book', c: 'chapter', s: 'settings' };
  const act = map[e.key];
  if (!act) return;
  e.preventDefault();
  activate(document.querySelector('[data-act="' + act + '"]'));
});
function addFill(b) { if (!b.querySelector('.fill')) { const f = document.createElement('span'); f.className = 'fill'; b.appendChild(f); } }

/* ---------- boot ---------- */
document.querySelectorAll('.btn').forEach(addFill);
applyLook(); renderReader(); show('reader');
requestAnimationFrame(renderPanel);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitAll(); renderPanel(); });
window.addEventListener('resize', () => { fitAll(); renderPanel(); });
toast('Mockup. Right-click any button to hear its name. The top line shows what is spoken.');
</script>
